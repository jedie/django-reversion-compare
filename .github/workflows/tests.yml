name: tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 8 * * *'

jobs:
  test:
    name: 'Python ${{ matrix.python-version }} Django ${{ matrix.django-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.13', '3.12']
        django-version: ['6.0', '5.2']
    steps:
    - name: Checkout
      run: |
        echo $GITHUB_REF $GITHUB_SHA
        git clone https://github.com/$GITHUB_REPOSITORY.git .
        git fetch origin $GITHUB_SHA:temporary-ci-branch
        git checkout $GITHUB_SHA || (git fetch && git checkout $GITHUB_SHA)

    - name: 'Set up Python ${{ matrix.python-version }}'
      uses: actions/setup-python@main
      # https://github.com/marketplace/actions/setup-python
      with:
        python-version: '${{ matrix.python-version }}'
        cache: 'pip' # caching pip dependencies

    - name: Install uv and set the Python version
      # https://docs.astral.sh/uv/guides/integration/github/#multiple-python-versions
      uses: astral-sh/setup-uv@main
      with:
        python-version: ${{ matrix.python-version }}

    - name: 'Bootstrap'
      # The first manage.py call will create the .venv
      run: |
        ./manage.py version

    - name: 'Display all Django commands'
      run: |
        ./manage.py --help

    - name: 'Run pip-audit'
      run: |
        ./manage.py pip_audit

    - name: 'Python ${{ matrix.python-version }} Django ${{ matrix.django-version }}'
      env:
        PYTHONUNBUFFERED: 1
        PYTHONWARNINGS: always
      run: |
        ./manage.py nox -e "tests-${{ matrix.python-version }}(django='${{ matrix.django-version }}')"

    - name: 'Upload coverage report'
      uses: codecov/codecov-action@main
      # https://github.com/marketplace/actions/codecov
      with:
        fail_ci_if_error: false
        verbose: true

